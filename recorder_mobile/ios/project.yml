name: HouseTourCapture
options:
  bundleIdPrefix: com.housetour
targets:
  HouseTourCapture:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - HouseTourCapture
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.housetour.capture
      PRODUCT_NAME: HouseTourCapture
      SWIFT_VERSION: "5.9"
      INFOPLIST_FILE: HouseTourCapture/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      AD_HOC_CODE_SIGNING_ALLOWED: YES
