name: HouseTourCapture
options:
  bundleIdPrefix: com.housetour
targets:
  HouseTourCapture:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HouseTourCapture
        excludes:
          - "Info.plist"
    info:
      path: HouseTourCapture/Info.plist
    settings:
      base:
        PRODUCT_NAME: HouseTourCapture
        PRODUCT_BUNDLE_IDENTIFIER: com.housetour.capture
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
