name: Build Native Mobile Apps (Zero Cost / No Mac Needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 🤖 JOB 1: Build Android APK in Free GitHub Linux Runner
  # ===========================================================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: recorder_mobile/android
        run: |
          chmod +x gradlew || true
          gradle wrapper
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HouseTourCapture-Android-APK
          path: |
            recorder_mobile/android/app/build/outputs/apk/debug/*.apk
            recorder_mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ===========================================================================
  # 🍏 JOB 2: Build iOS Native IPA in Free GitHub macOS Runner
  # ===========================================================================
  build-ios:
    name: 🍏 Build iOS Native IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project & Build IPA
        working-directory: recorder_mobile/ios
        run: |
          xcodegen generate
          xcodebuild -project HouseTourCapture.xcodeproj \
                     -scheme HouseTourCapture \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          echo "Packaging .ipa for Sideloadly..."
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HouseTourCapture.app Payload/
          zip -r HouseTourCapture.ipa Payload
          echo "IPA created successfully!"

      - name: Upload iOS IPA for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: HouseTourCapture-iOS-IPA
          path: recorder_mobile/ios/HouseTourCapture.ipa
          if-no-files-found: error
