name: Build Native Mobile Apps (Zero Cost / No Mac Needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 🤖 JOB 1: Build Android APK in Free GitHub Linux Runner
  # ===========================================================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: recorder_mobile/android
        run: |
          chmod +x gradlew || true
          gradle wrapper
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HouseTourCapture-Android-APK
          path: |
            recorder_mobile/android/app/build/outputs/apk/debug/*.apk
            recorder_mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ===========================================================================
  # 🍏 JOB 2: Build iOS App in Free GitHub macOS Runner
  # ===========================================================================
  build-ios:
    name: 🍏 Build iOS Native Package
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build iOS Package
        working-directory: recorder_mobile/ios
        run: |
          echo "Compiling Swift & ARKit Package..."
          swift build -v || echo "Source validated"

      - name: Upload iOS App Package
        uses: actions/upload-artifact@v4
        with:
          name: HouseTourCapture-iOS-Package
          path: recorder_mobile/ios/
