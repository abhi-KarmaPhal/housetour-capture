name: Build Native Mobile Apps (Zero Cost / No Mac Needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 🤖 JOB 1: Build Android APK in Free GitHub Linux Runner
  # ===========================================================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: recorder_mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: HouseTourCapture-Android-APK
          path: |
            recorder_mobile/android/app/build/outputs/apk/debug/*.apk
            recorder_mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # ===========================================================================
  # 🍏 JOB 2: Build iOS Native IPA in Free GitHub macOS Runner
  # ===========================================================================
  build-ios:
    name: 🍏 Build iOS Native IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install xcodegen

      - name: Generate Xcode Project
        working-directory: recorder_mobile/ios
        run: |
          set -e
          echo "=== Generating Xcode project from project.yml ==="
          xcodegen generate --spec project.yml
          echo "=== Xcode project generated successfully ==="
          xcodebuild -project HouseTourCapture.xcodeproj -list

      - name: Build iOS App
        working-directory: recorder_mobile/ios
        run: |
          set -e
          echo "=== Compiling iOS Release Binary for generic/platform=iOS ==="
          xcodebuild build \
            -project HouseTourCapture.xcodeproj \
            -scheme HouseTourCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          echo "=== Xcode Build Finished ==="

      - name: Package IPA for Sideloadly
        working-directory: recorder_mobile/ios
        run: |
          set -e
          echo "=== Locating compiled .app bundle ==="
          find build -name "*.app" -type d
          APP_PATH=$(find build -name "HouseTourCapture.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No HouseTourCapture.app bundle found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r HouseTourCapture.ipa Payload
          ls -lh HouseTourCapture.ipa
          echo "HouseTourCapture.ipa packaged successfully!"

      - name: Upload iOS IPA for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: HouseTourCapture-iOS-IPA
          path: recorder_mobile/ios/HouseTourCapture.ipa
          if-no-files-found: error
