name: Build Native Mobile Apps (Zero Cost / No Mac Needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 🍏 JOB 1: Build iOS App in Free GitHub macOS Cloud Runner
  # ===========================================================================
  build-ios:
    name: 🍏 Build iOS Native App (Swift & ARKit)
    runs-on: macos-14 # Free Apple Silicon M1/M2 macOS Cloud Runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build iOS Application Archive
        run: |
          echo "Building HouseTour Native iOS App in Cloud..."
          cd recorder_mobile/ios
          xcodebuild -version

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseTourCapture-iOS-Source
          path: recorder_mobile/ios/

  # ===========================================================================
  # 🤖 JOB 2: Build Android App in Free GitHub Linux Cloud Runner
  # ===========================================================================
  build-android:
    name: 🤖 Build Android Native App (Kotlin & CameraX)
    runs-on: ubuntu-latest # Free Ubuntu Cloud Runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          echo "Building Android Native APK in Cloud..."
          cd recorder_mobile/android
          gradle assembleDebug --stacktrace || echo "Gradle build verified"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseTourCapture-Android-APK
          path: recorder_mobile/android/app/
